# ═══════════════════════════════════════════════════════════════════
# 墟司（xusi）管理面配置
# ═══════════════════════════════════════════════════════════════════

# 管理面自身的监听地址：0.0.0.0 = 对外（voidhub / 局域网 WebUI 经此一个端口）
# 所有 agent 的访问都经 8601 反代；agent 默认只听 127.0.0.1，不单独暴露
[server]
host = "0.0.0.0"
port = 8601

[manager]
# xuseek-v2 源码：自管于本目录下（不入 git；缺失时自动从 source_repo 拉取）
source_dir = "/home/htao/work/xusi/xuseek-v2"
source_repo = "https://github.com/oppry12102/xuseek-v2"
# agent 端口分配段（8601 归管理面，agent 从 8602 起）
port_range = [8602, 8699]
# 给用户展示用的时区
display_timezone = "Asia/Shanghai"
