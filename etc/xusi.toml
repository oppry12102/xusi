# ═══════════════════════════════════════════════════════════════════
# 墟司（xusi）管理面配置
# ═══════════════════════════════════════════════════════════════════

# 管理面自身的监听地址：0.0.0.0 = 对外（voidhub / 局域网 WebUI 经此一个端口）
# 所有 agent 的访问都经 8601 反代；agent 默认只听 127.0.0.1，不单独暴露
[server]
host = "0.0.0.0"
port = 8601

[manager]
# ── 新约定（2026-08-24）：只有 versions/ 是 xuseek-v2 源码的事实源 ──
# 共享主源码（source_dir）已废弃——新建 agent 一律从 versions/ 选版本，解压到
# instances/<id>/xuseek-v2/ 作实例私有副本，实例间互不影响、可单独迁移。
# 管理员投放版本包：把 git tag 出的 zip（如 xuseek-v2-v2.5.2.zip）放进 versions/。
#   cd /path/to/xuseek-v2 && git checkout v2.5.2
#   git archive --format=zip -o /path/to/xusi/versions/xuseek-v2-v2.5.2.zip HEAD
# versions/ 整目录不入 git——zip 里是私有源码（见 docs/versions.md）。
versions_dir = "/home/ubuntu/work/xusi/versions"

# 共享主源码 source_dir / source_repo 已废弃，留作过渡期兼容说明（当前置空）：
#  - 仅现存 agent 与显式 source_version="main"（或仓库为空时的缺省回落）会用
#  - 新建 agent 不再走共享主源码
# source_dir = "/home/ubuntu/work/xusi/xuseek-v2"
# source_repo = "https://github.com/oppry12102/xuseek-v2"

# agent 端口分配段（8601 归管理面，agent 从 8602 起）
port_range = [8602, 8699]
# 给用户展示用的时区
display_timezone = "Asia/Shanghai"